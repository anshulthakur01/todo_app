{% extends "base.html" %}

{% block main %}
<div class="container mx-auto pt-24 px-4 max-w-3xl">
    <div class="bg-white backdrop-blur-sm bg-opacity-50 p-6 rounded-2xl shadow-sm border border-white/30">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-bold">Edit Task</h1>
            <a href="/" class="text-gray-500 hover:text-gray-700">
                <i class="fas fa-times"></i>
            </a>
        </div>
        
        <form method="POST" class="space-y-6">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <!-- Task Title -->
                <div>
                    <label class="block text-sm font-medium mb-2">Task Title</label>
                    <input type="text" 
                           name="task"
                           value="{{ task.task }}" 
                           class="w-full px-4 py-3 border border-gray-200 rounded-xl"
                           required>
                </div>

                <!-- Due Date -->
                <div>
                    <label class="block text-sm font-medium mb-2">Due Date</label>
                    <input type="datetime-local" 
                           name="due_date"
                           value="{{ task.due_date }}" 
                           class="w-full px-4 py-3 border border-gray-200 rounded-xl">
                </div>
                
                <!-- Status -->
                <div>
                    <label class="block text-sm font-medium mb-2">Status</label>
                    <select name="status" class="w-full px-4 py-3 border border-gray-200 rounded-xl">
                        <option value="">Select status :</option>
                        {% for status in STATUS_CHOICES %}
                            <option value="{{ status }}" {% if task.status == status %}selected{% endif %}>{{ status|formatted_string }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <!-- Priority -->
                <div>
                    <label class="block text-sm font-medium mb-2">Priority</label>
                    <select name="priority" class="w-full px-4 py-3 border border-gray-200 rounded-xl">
                        <option value="">Select priority :</option>
                        {% for priority in PRIORITY_CHOICES %}
                            <option value="{{ priority }}" {% if task.priority == priority %}selected{% endif %}>{{ priority|formatted_string }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <!-- Description -->
            <div class="lg:col-span-2">
                <label class="block text-sm font-medium mb-2">Description</label>
                <textarea name="description" 
                          class="w-full px-4 py-3 border border-gray-200 rounded-xl h-32">{{ task.description }}</textarea>
            </div>

            <!-- Update button -->
            <div class="flex justify-end gap-4 pt-6 border-t border-gray-100">
                <button type="submit" class="px-8 py-3 bg-gradient-to-r from-blue-500 to-purple-600 text-white rounded-xl hover:opacity-90 transition-opacity">
                    Update Task
                </button>
            </div>
        </form>
    </div>
</div>

<script>
function setPriority(priority) {
    const priorityInput = document.getElementById('priorityInput');
    priorityInput.value = priority;
    
    document.querySelectorAll('.priority-btn').forEach(btn => {
        btn.classList.remove(
            'bg-high-50', 'text-high-800', 'border-high-300',
            'bg-medium-50', 'text-medium-800', 'border-medium-300',
            'bg-low-50', 'text-low-800', 'border-low-300'
        );
        btn.classList.add('bg-gray-50', 'text-gray-800', 'border-gray-200');
        
        if(btn.dataset.priority === priority) {
            btn.classList.remove('bg-gray-50', 'text-gray-800', 'border-gray-200');
            btn.classList.add(`bg-${priority}-50`, `text-${priority}-800`, `border-${priority}-300`);
        }
    });
}
</script>
{% endblock %}
