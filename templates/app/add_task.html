{% extends "base.html" %}

{% block main %}
<div class="container mx-auto pt-24 px-4 max-w-3xl">
    <div class="bg-white backdrop-blur-sm bg-opacity-50 p-6 rounded-2xl shadow-sm border border-white/30">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-bold">Create New Task</h1>
            <a href="/" class="text-gray-500 hover:text-gray-700">
                <i class="fas fa-times"></i>
            </a>
        </div>
        
        <form class="space-y-6" method="post">
            <!-- Same form fields as modal version but enhanced -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium mb-2">Task Title</label>
                    <input type="text" name="task" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-purple-500" required>
                </div>

                <div>
                    <label class="block text-sm font-medium mb-2">Due Date</label>
                    <input type="datetime-local" name="due_date" class="w-full px-4 py-3 border border-gray-200 rounded-xl" required>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <!-- Status -->
                <div>
                    <label class="block text-sm font-medium mb-2">Status</label>
                    <select name="status" class="w-full px-4 py-3 border border-gray-200 rounded-xl">
                        <option value="">Select task status :</option>
                        {% for status in STATUS_CHOICES %}
                            <option value="{{ status }}" {% if status=="pending" %}selected{% endif %}>{{ status|formatted_string }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <!-- Priority -->
                <div>
                    <label class="block text-sm font-medium mb-2">Priority</label>
                    <select name="priority" class="w-full px-4 py-3 border border-gray-200 rounded-xl">
                        <option value="">Select task priority :</option>
                        {% for priority in PRIORITY_CHOICES %}
                            <option value="{{ priority }}" {% if priority=="medium" %}selected{% endif %}>{{ priority|formatted_string }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <!-- Full-width description field -->
            <div>
                <label class="block text-sm font-medium mb-2">Description</label>
                <textarea name="description" class="w-full px-4 py-3 h-32 border border-gray-200 rounded-xl custom-scroll"></textarea>
            </div>

            <!-- Enhanced action buttons -->
            <div class="flex flex-col-reverse sm:flex-row justify-end gap-4 pt-6 border-t border-gray-100">
                <a href="/" class="px-8 py-3 text-center text-gray-600 hover:bg-gray-50 rounded-xl">
                    Cancel
                </a>
                <button class="px-8 py-3 bg-gradient-to-r from-blue-500 to-purple-600 text-white rounded-xl hover:shadow-lg">
                    Create Task
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
