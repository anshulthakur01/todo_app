<!-- 404.html -->
{% extends "base.html" %}

{% block main %}
<div class="min-h-screen flex items-center justify-center px-4 relative overflow-hidden">
    <!-- Animated Background Elements -->
    <div class="absolute inset-0 overflow-hidden">
        <div class="stars absolute w-1 h-1 bg-white rounded-full animate-pulse" style="top:20%; left:15%"></div>
        <div class="stars absolute w-1 h-1 bg-white rounded-full animate-pulse" style="top:70%; left:85%"></div>
        <div class="stars absolute w-1 h-1 bg-purple-300 rounded-full animate-pulse" style="top:40%; left:65%"></div>
    </div>

    <div class="max-w-4xl w-full text-center space-y-8 relative">
        <!-- Content -->
        <div class="space-y-4">
            <h1 class="text-9xl font-bold bg-gradient-to-r from-blue-500 to-purple-600 bg-clip-text text-transparent animate-gradient-x">
                404
            </h1>
            <h2 class="text-3xl font-semibold text-gray-800">Lost in Space?</h2>
            <p class="text-gray-600 max-w-xl mx-auto">
                The page you're looking for seems to have drifted off into the cosmic void. 
                Let's get you back to safety!
            </p>
            <a href="{{ url_for('index') }}" 
               class="inline-block px-8 py-3 bg-gradient-to-r from-blue-500 to-purple-600 text-white rounded-xl 
                      hover:shadow-lg transition-all duration-300 transform hover:scale-105">
                Beam Me Home
            </a>
        </div>
    </div>
</div>

<style>
    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-20px); }
    }
    @keyframes bounce-slow {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
    }
    @keyframes gradient-x {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
    .animate-float { animation: float 6s ease-in-out infinite; }
    .animate-bounce-slow { animation: bounce-slow 4s ease-in-out infinite; }
    .animate-gradient-x {
        background-size: 200% auto;
        animation: gradient-x 5s ease infinite;
    }
    .stars { animation: twinkle 2s infinite; }
    @keyframes twinkle {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
    }
</style>
{% endblock %}
